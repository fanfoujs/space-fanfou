name: Extension CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:all
      - run: npm run verify:build
      - run: npm run lint:firefox
  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:safari
      - run: npm run safari:project
      - run: xcodebuild -project '.output/safari-project/Space Fanfou/Space Fanfou.xcodeproj' -scheme 'Space Fanfou' -configuration Debug -derivedDataPath /tmp/space-fanfou-derived CODE_SIGNING_ALLOWED=NO build
